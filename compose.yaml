services:
  postgresql:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
  database-migrations:
    image: database-migrations:latest
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgresql:5432/health_monitor
      DATABASE_ALEMBIC_MIGRATION_ROLLBACK: false
      DATABASE_ALEMBIC_MIGRATION_REVISION: INVALID
    command: database-migrations
    depends_on:
      postgresql:
        condition: service_healthy
  health-monitor-backend:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgresql:5432/health_monitor
    command: health-monitor-backend
    ports:
      - "8000:8000"
    depends_on:
      - database-migrations
volumes:
  postgres_data:
