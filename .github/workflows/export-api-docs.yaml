name: Export API Documentation

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: export-api-docs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  export-api-docs:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
      - name: Checkout repository at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create virtual environment
        run: uv sync
      - name: Generate API docs
        run: uv run python scripts/export_openapi.py
      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Open and auto-merge pull request with API docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          version="${GITHUB_REF_NAME}"
          git add api_docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="docs/api-docs-${version}"
          git checkout -B "${BRANCH}"
          git commit -m "docs: regenerate OpenAPI specs for ${version}"
          git push --force origin "${BRANCH}"
          pr_url=$(gh pr list --head "${BRANCH}" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "${pr_url}" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "docs: regenerate OpenAPI specs for ${version}" \
              --body "Automatically generated OpenAPI specs for release \`${version}\`.")
          fi
          gh pr merge "${pr_url}" --squash --delete-branch --auto || \
            gh pr merge "${pr_url}" --squash --delete-branch
