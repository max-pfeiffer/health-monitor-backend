name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "api_docs/**"

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
      bumped: ${{ steps.cz.outcome == 'success' }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Bump version and update changelog
        id: cz
        continue-on-error: true
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          changelog_increment_filename: body.md
      - name: Create GitHub release
        if: steps.cz.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.cz.outputs.version }}" \
            --title "${{ steps.cz.outputs.version }}" \
            --notes-file body.md \
            --target main