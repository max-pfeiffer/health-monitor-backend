name: Export API Docs

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  export-api-docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create Virtual environment
        run: uv sync
      - name: Generate API docs
        run: uv run python scripts/export_openapi.py
      - name: Open pull request with API docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api_docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="docs/api-docs-${GITHUB_REF_NAME}"
          git checkout -b "${BRANCH}"
          git commit -m "docs: regenerate OpenAPI specs for ${GITHUB_REF_NAME}"
          git push --force-with-lease origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "docs: regenerate OpenAPI specs for ${GITHUB_REF_NAME}" \
            --body "Automatically generated OpenAPI specs for release \`${GITHUB_REF_NAME}\`."
