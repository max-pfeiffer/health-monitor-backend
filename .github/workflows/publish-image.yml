name: Publish Image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/health-monitor-backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          uv run python -m scripts.build \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE}:latest" \
            --push
