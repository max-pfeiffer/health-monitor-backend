name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "api_docs/**"

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
      bumped: ${{ steps.cz.outcome == 'success' }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Bump version and update changelog
        id: cz
        continue-on-error: true
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          changelog_increment_filename: body.md
      - name: Create GitHub release
        if: steps.cz.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.cz.outputs.version }}" \
            --title "${{ steps.cz.outputs.version }}" \
            --notes-file body.md \
            --target main

  publish-image:
    needs: release
    if: needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-24.04
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Verify Docker Hub credentials are configured
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "::error::DOCKER_HUB_USERNAME and/or DOCKER_HUB_TOKEN repository secrets are not set."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "IMAGE=docker.io/${DOCKER_HUB_USERNAME}/health-monitor-backend" >> "$GITHUB_ENV"
      - name: Checkout repository at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create virtual environment
        run: uv sync
      - name: Log in to Docker Hub
        run: echo "$DOCKER_HUB_TOKEN" | podman login docker.io -u "$DOCKER_HUB_USERNAME" --password-stdin
      - name: Build and push image
        run: |
          uv run python -m scripts.build \
            --tag "${IMAGE}:${{ needs.release.outputs.version }}" \
            --tag "${IMAGE}:latest" \
            --push

  export-api-docs:
    needs: release
    if: needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create virtual environment
        run: uv sync
      - name: Generate API docs
        run: uv run python scripts/export_openapi.py
      - name: Open pull request with API docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api_docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          branch="docs/api-docs-${version}"
          git checkout -b "${branch}"
          git commit -m "docs: regenerate OpenAPI specs for ${version}"
          git push --force-with-lease origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "docs: regenerate OpenAPI specs for ${version}" \
            --body "Automatically generated OpenAPI specs for release \`${version}\`."
