name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "api_docs/**"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create virtual environment
        run: uv sync
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version with commitizen
        id: bump
        run: |
          set +e
          output=$(uv run cz bump --yes --changelog 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            version=$(uv run cz version --project)
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            git push --follow-tags origin main
          elif echo "$output" | grep -qE "NoCommitsFoundError|NoneIncrementExit|NoCommitsIncrementError"; then
            echo "::notice::No bumpable commits since last tag; skipping release"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            exit $exit_code
          fi
      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          uv run cz changelog --dry-run "${version}" > release_notes.md
          gh release create "${version}" \
            --title "${version}" \
            --notes-file release_notes.md \
            --target main

  publish-image:
    needs: release
    if: needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-24.04
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Verify Docker Hub credentials are configured
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "::error::DOCKER_HUB_USERNAME and/or DOCKER_HUB_TOKEN repository secrets are not set."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "IMAGE=docker.io/${DOCKER_HUB_USERNAME}/health-monitor-backend" >> "$GITHUB_ENV"
      - name: Checkout repository at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create virtual environment
        run: uv sync
      - name: Log in to Docker Hub
        run: echo "$DOCKER_HUB_TOKEN" | podman login docker.io -u "$DOCKER_HUB_USERNAME" --password-stdin
      - name: Build and push image
        run: |
          uv run python -m scripts.build \
            --tag "${IMAGE}:${{ needs.release.outputs.version }}" \
            --tag "${IMAGE}:latest" \
            --push

  export-api-docs:
    needs: release
    if: needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Create virtual environment
        run: uv sync
      - name: Generate API docs
        run: uv run python scripts/export_openapi.py
      - name: Open pull request with API docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api_docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          branch="docs/api-docs-${version}"
          git checkout -b "${branch}"
          git commit -m "docs: regenerate OpenAPI specs for ${version}"
          git push --force-with-lease origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "docs: regenerate OpenAPI specs for ${version}" \
            --body "Automatically generated OpenAPI specs for release \`${version}\`."
