[project]
name = "health-monitor-backend"
version = "0.3.0"
description = "Health metrics monitoring backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.21",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "matplotlib>=3.9",
    "click>=8.1",
    "seaborn>=0.13.2",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=0.28",
    "ruff>=0.8",
    "pre-commit>=3.5",
    "testcontainers[postgres,registry]>=4.8",
    "python-on-whales>=0.74",
    "requests>=2.32",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=xml --cov-report=term"
