[project]
name = "health-monitor-backend"
version = "0.9.2"
description = "Health metrics monitoring backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.21",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "matplotlib>=3.9",
    "click>=8.1",
    "seaborn>=0.13.2",
    "pandas>=3.0.3",
    "python-jose[cryptography]>=3.3",
    "httpx2>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.6.0",
    "commitizen>=4.16",
    "testcontainers[postgres,registry]>=4.8",
    "python-on-whales>=0.81.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=xml --cov-report=term -m 'not slow'"
markers = [
    "slow: slow-running tests (e.g. building/running the container image); excluded by default, run with -m slow",
]

[tool.commitizen]
name = "cz_conventional_commits"
